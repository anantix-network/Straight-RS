[workspace]
resolver = "2"
members = ["crates/straight-rs-model", "crates/straight-rs", "crates/straight-rs-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/anantix-network/Straight-RS"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "signal", "rt-multi-thread"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
hyper = { version = "1", features = ["http1", "client"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
dashmap = "6"
arc-swap = "1"
percent-encoding = "2"
rand = "0.10"
straight-rs-model = { path = "crates/straight-rs-model", version = "0.1.0" }
straight-rs = { path = "crates/straight-rs", version = "0.1.0" }
