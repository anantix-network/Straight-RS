name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p larplink --features twilight
      - run: cargo test -p larplink --features serenity
      - run: cargo test -p larplink --features songbird
      - run: cargo check -p larplink --features tls
      - run: cargo build -p larplink --examples
      - run: cargo bench -p larplink --no-run
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
